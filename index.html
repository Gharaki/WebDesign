<!-- Estrutura inicial do documento: Crie a estrutura básica de um documento HTML5 contendo: <!DOCTYPE html> A tag <html> com atributo lang="pt-BR" O bloco <head> com <meta charset="utf-8"> e <title> O bloco <body> vazio-->
<!DOCTYPE html>
<html Lang="pt-br">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="style.css">
    <title>MEU HTML</title>
</head>
<!--Cabeçalho e títulos: Dentro da tag <body>, crie um cabeçalho (<header>) com os seguintes elementos: Um <h1> centralizado Um <h2> alinhado à esquerda Um <h3> alinhado à direita Um <h4>, <h5> e <h6> simples-->
<body>
    <header>
        <h1 align="center"> Texto central</h1>
        <h2 align="left" >H2 a esquerda</h2>
        <h3 align="right">h3 a direita</h3>
        <h4>h4 padrão</h4>
        <h5>h5 padrão</h5>
        <h6>h6 padrão</h6>
<!--Seção de posts: Crie uma <section> com id="posts". Dentro dela, adicione um <article class="post"> com um <header> que contenha um <h2>: “Meu Blog – Primeiro Post”.-->
        <section id="post">
            <article class="'post">
                <header>
                    <h2>Meu blog - Meu primeiro Post</h2>
                </header>
                <!--Primeiro parágrafo formatado: No <article>, adicione um parágrafo (<p>) com os seguintes estilos de texto: Negrito usando <strong> Itálico usando <em> Texto sublinhado com CSS (text-decoration: underline) Texto riscado com CSS (text-decoration: line-through) Um exemplo de <sub> e <sup>-->
    <p>
        <strong>Negrito</strong>
        <em>Itálico</em>
        <span class="sublinhado">Texto sublinhado</span>
        <span class="riscado">Texto riscado</span>
    </p>
            </article>
        </section>
<!--Menu de navegação: Adicione um bloco <nav> contendo um parágrafo (<p>) com três links (<a>): “Posts” → #posts “Lateral” → #lateral “Rodapé” → #rodape Separe-os com-->
        <nav>
            <p>Menu de navegação
                <a href='#posts'>Posts</a> |
                <a href='#lateral'>Lateral</a> |
                <a href='#rodape'>Rodapé</a> |
            </p>
        </nav>
    </header>
</body>
